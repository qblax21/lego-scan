<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d01012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LEGO Scan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<title>LEGO Scan</title>
</head>
<body>
<main>
  <div id="banner" class="banner" role="alert" hidden></div>
  <div class="seg modes" role="group" aria-label="Mode">
    <button id="modeScan" class="on">Scan</button>
    <button id="modeRecount">Recount</button>
  </div>

  <div id="scanOnly">
    <div class="seg" role="group" aria-label="Destination">
      <button id="destPersonal" class="on">Personal</button>
      <button id="destSale">Sale</button>
    </div>

    <select id="cond" aria-label="Condition"></select>
    <details id="more" class="more">
      <summary>More details (optional)</summary>
      <div id="fields"></div>
    </details>
  </div>

  <div class="cam">
    <video id="video" playsinline muted></video>
    <div class="reticle"><i></i><i></i><i></i><i></i></div>
    <div id="flash" class="flash"></div>
    <button id="startBtn" class="start">Tap to start camera</button>
  </div>
  <div id="dbg" class="dbg" hidden></div>
  <div id="tst" class="tst" hidden>
    <div class="trow">
      <button id="tstToggle" class="ghost">Scan test: off</button>
      <button id="tstNext" class="ghost" hidden>Next box</button>
    </div>
    <pre id="tstOut" hidden></pre>
    <div class="trow">
      <button id="tstCopy" class="ghost" hidden>Copy results</button>
      <button id="tstReset" class="ghost" hidden>Reset</button>
    </div>
  </div>
  <p id="msg" class="msg">Point at a box barcode</p>

  <form id="manual" class="manual">
    <input id="manualInput" inputmode="text" autocomplete="off" placeholder="Type set # or barcode">
    <button type="submit">Add</button>
  </form>

  <div id="scanBox">
    <div class="row">
      <h2>Last 5 scans</h2>
      <button id="undoBtn" class="ghost" disabled>Undo last</button>
    </div>
    <ul id="list" class="list"></ul>
  </div>

  <div id="recountBox" hidden>
    <div class="row">
      <h2 id="rcTitle">Recount</h2>
      <button id="rcReset" class="ghost">New recount</button>
    </div>
    <ul id="rcList" class="list"></ul>
  </div>

  <p id="bsUse" class="bs"></p>
  <div class="foot">
    <span id="net"></span>
    <span><button id="dbgBtn" class="ghost">Debug</button> <button id="cfgBtn" class="ghost">Sheets</button> <button id="csvBtn" class="ghost">CSV</button></span>
  </div>
</main>
<div id="dlg" class="dlg" hidden>
  <div class="box">
    <p id="dlgText"></p>
    <button id="dlgYes">Yes</button>
    <button id="dlgNo" class="ghost">No</button>
  </div>
</div>
<div id="dlgSet" class="dlg" hidden>
  <form id="dlgSetForm" class="box">
    <p id="dlgSetText"></p>
    <input id="dlgSetInput" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="done" placeholder="Set number, e.g. 75192">
    <p id="dlgSetErr" class="err"></p>
    <button type="submit">Save set number</button>
    <button type="button" id="dlgSetSkip" class="ghost">Skip - save as needs set number</button>
  </form>
</div>
<script src="vendor/zxing.min.js"></script>
<script src="app.js"></script>
</body>
</html>
