<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d01012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LEGO Scan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<title>LEGO Scan</title>
</head>
<body>
<main>
  <div class="seg" role="group" aria-label="Destination">
    <button id="destPersonal" class="on">Personal</button>
    <button id="destSale">Sale</button>
  </div>

  <div class="cam">
    <video id="video" playsinline muted></video>
    <div class="reticle"></div>
    <div id="flash" class="flash"></div>
    <button id="startBtn" class="start">Tap to start camera</button>
  </div>
  <p id="msg" class="msg">Point at a box barcode</p>

  <form id="manual" class="manual">
    <input id="manualInput" inputmode="text" autocomplete="off" placeholder="Type set # or barcode">
    <button type="submit">Add</button>
  </form>

  <div class="row">
    <h2>Last 5 scans</h2>
    <button id="undoBtn" class="ghost" disabled>Undo last</button>
  </div>
  <ul id="list" class="list"></ul>

  <div class="foot">
    <span id="net"></span>
    <button id="csvBtn" class="ghost">Export CSV</button>
  </div>
</main>
<script src="vendor/zxing.min.js"></script>
<script src="app.js"></script>
</body>
</html>
